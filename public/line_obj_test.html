<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line.obj路径解析测试</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas {
            display: block;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
        }
        
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            min-width: 320px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .controls h2 {
            margin: 0 0 15px 0;
            color: #4CAF50;
            font-size: 18px;
            text-align: center;
        }
        
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 5px;
            width: 100%;
        }
        
        .btn-primary {
            background: #4CAF50;
            color: white;
        }
        
        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        .status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            min-width: 280px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .status h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
            font-size: 16px;
            text-align: center;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .status-value {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .log {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 120px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .log-entry {
            margin-bottom: 3px;
            padding: 2px 0;
        }
        
        .log-entry.success {
            color: #4CAF50;
        }
        
        .log-entry.error {
            color: #f44336;
        }
        
        .log-entry.info {
            color: #2196F3;
        }
        
        .log-entry.warning {
            color: #FF9800;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #4CAF50;
            font-size: 18px;
            z-index: 100;
        }
        
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>正在解析Line.obj路径数据...</div>
        </div>
        
        <div class="controls" id="controls" style="display: none;">
            <h2>🛤️ Line.obj路径解析测试</h2>
            
            <button class="btn-primary" onclick="testPathParsing()">重新解析路径</button>
            <button class="btn-primary" onclick="showPathInfo()">显示路径信息</button>
            <button class="btn-primary" onclick="createPathVisualization()">创建路径可视化</button>
        </div>
        
        <div class="status" id="status" style="display: none;">
            <h3>📊 路径状态</h3>
            <div class="status-item">
                <span>解析状态:</span>
                <span class="status-value" id="parseStatus">-</span>
            </div>
            <div class="status-item">
                <span>路径数量:</span>
                <span class="status-value" id="pathCount">-</span>
            </div>
            <div class="status-item">
                <span>路径名称:</span>
                <span class="status-value" id="pathNames">-</span>
            </div>
        </div>
        
        <div class="log" id="log"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
    <script src="https://threejs.org/examples/js/controls/OrbitControls.js"></script>
    <script>
        // 全局变量
        let scene, camera, renderer, controls;
        let pathManager = null;
        let pathLines = [];
        
        // 初始化Three.js场景
        function initThreeJS() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 50);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'),
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // 添加光源
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            scene.add(directionalLight);
            
            // 添加网格
            const gridHelper = new THREE.GridHelper(100, 100, 0x333333, 0x333333);
            scene.add(gridHelper);
            
            // 添加坐标轴
            const axesHelper = new THREE.AxesHelper(20);
            scene.add(axesHelper);
            
            // 添加轨道控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // 开始渲染循环
            animate();
            
            log('✅ Three.js场景初始化完成', 'success');
        }
        
        // 创建PathManager类
        class PathManager {
            constructor() {
                this.paths = new Map();
                this.pathData = new Map();
                this.isInitialized = false;
                log('🛤️ PathManager 已创建', 'info');
            }
            
            async parseOBJFile(objUrl) {
                log('🔍 直接从OBJ文件解析路径数据...', 'info');
                
                try {
                    // 使用fetch加载OBJ文件
                    const response = await fetch(objUrl);
                    const text = await response.text();
                    
                    // 解析OBJ文件内容
                    const pathData = this.parseOBJText(text);
                    
                    let foundCount = 0;
                    
                    // 为每个路径创建样条曲线
                    for (const path of pathData) {
                        if (path.vertices.length >= 2) {
                            log(`✅ 解析路径: ${path.name}, 顶点数: ${path.vertices.length}`, 'success');
                            
                            try {
                                // 创建样条曲线
                                const curve = new THREE.CatmullRomCurve3(path.vertices);
                                curve.closed = false;
                                
                                // 计算路径长度，确定均匀分布的点数
                                const pathLength = curve.getLength();
                                const uniformPointCount = Math.max(50, Math.floor(pathLength * 2));
                                
                                // 生成均匀分布的点
                                const uniformPoints = curve.getPoints(uniformPointCount);
                                
                                // 创建新的样条曲线，使用均匀分布的点
                                const uniformCurve = new THREE.CatmullRomCurve3(uniformPoints);
                                uniformCurve.closed = false;
                                
                                // 添加自定义方法，确保匀速运动
                                uniformCurve.getUniformPoint = function(t) {
                                    return this.getPoint(t);
                                };
                                
                                uniformCurve.getUniformTangent = function(t) {
                                    return this.getTangent(t);
                                };
                                
                                // 存储样条曲线
                                this.paths.set(path.name, uniformCurve);
                                
                                // 创建路径数据
                                const pathInfo = {
                                    name: path.name,
                                    originalName: path.name,
                                    curve: uniformCurve,
                                    mesh: null,
                                    length: uniformCurve.getLength(),
                                    points: path.vertices.map(v => ({ x: v.x, y: v.y, z: v.z })),
                                    boundingBox: this.calculatePathBoundingBoxFromVertices(path.vertices)
                                };
                                
                                this.pathData.set(path.name, pathInfo);
                                foundCount++;
                                
                                log(`  - 路径长度: ${pathInfo.length.toFixed(2)}`, 'info');
                                log(`  - 路径点数: ${pathInfo.points.length}`, 'info');
                                log(`  - 均匀点数: ${uniformPointCount}`, 'info');
                                
                            } catch (error) {
                                log(`❌ 生成路径 ${path.name} 的样条曲线失败: ${error.message}`, 'error');
                            }
                        }
                    }
                    
                    this.isInitialized = true;
                    log(`📊 OBJ文件解析完成，共找到 ${foundCount} 条路径`, 'success');
                    return foundCount;
                    
                } catch (error) {
                    log(`❌ 解析OBJ文件时出错: ${error.message}`, 'error');
                    return 0;
                }
            }
            
            parseOBJText(text) {
                // 处理换行符
                if (text.indexOf("\n") !== -1) {
                    text = text.replace(/\r\n\s+/g, "\n");
                }

                if (text.indexOf("\\\n") !== -1) {
                    text = text.replace(/\\\n/g, "");
                }

                const lines = text.split("\n");
                const result = [];
                let currentPath = null;
                let vertices = [];
                let vertexIndex = 1; // OBJ文件中的顶点索引从1开始

                for (let i = 0, l = lines.length; i < l; i++) {
                    let line = lines[i].trim();
                    
                    if (line.length === 0) continue;

                    const lineFirstChar = line.charAt(0);

                    if (lineFirstChar === "o") {
                        // 新的对象开始
                        if (currentPath && vertices.length > 0) {
                            result.push(currentPath);
                        }
                        
                        const name = line.split(/\s+/)[1];
                        currentPath = { name, vertices: [] };
                        vertices = [];
                        vertexIndex = 1;
                        
                    } else if (lineFirstChar === "v") {
                        // 顶点数据
                        const data = line.split(/\s+/);
                        const vertex = new THREE.Vector3(
                            parseFloat(data[1]), 
                            parseFloat(data[2]), 
                            parseFloat(data[3])
                        );
                        vertices.push(vertex);
                        vertexIndex++;
                        
                    } else if (lineFirstChar === "l") {
                        // 线条数据，根据索引获取顶点
                        if (currentPath) {
                            const data = line.split(/\s+/);
                            const lineVertices = [];
                            
                            for (let j = 1; j < data.length; j++) {
                                const index = parseInt(data[j]) - 1; // 转换为0基索引
                                if (index >= 0 && index < vertices.length) {
                                    lineVertices.push(vertices[index]);
                                }
                            }
                            
                            // 将线条顶点添加到当前路径
                            currentPath.vertices.push(...lineVertices);
                        }
                    }
                }

                // 添加最后一个路径
                if (currentPath && currentPath.vertices.length > 0) {
                    result.push(currentPath);
                }

                return result;
            }
            
            calculatePathBoundingBoxFromVertices(vertices) {
                if (vertices.length === 0) {
                    return {
                        min: { x: 0, y: 0, z: 0 },
                        max: { x: 0, y: 0, z: 0 },
                        center: { x: 0, y: 0, z: 0 },
                        size: { x: 0, y: 0, z: 0 }
                    };
                }

                let minX = vertices[0].x, maxX = vertices[0].x;
                let minY = vertices[0].y, maxY = vertices[0].y;
                let minZ = vertices[0].z, maxZ = vertices[0].z;

                for (const vertex of vertices) {
                    minX = Math.min(minX, vertex.x);
                    maxX = Math.max(maxX, vertex.x);
                    minY = Math.min(minY, vertex.y);
                    maxY = Math.max(maxY, vertex.y);
                    minZ = Math.min(minZ, vertex.z);
                    maxZ = Math.max(maxZ, vertex.z);
                }

                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;
                const centerZ = (minZ + maxZ) / 2;

                return {
                    min: { x: minX, y: minY, z: minZ },
                    max: { x: maxX, y: maxY, z: maxZ },
                    center: { x: centerX, y: centerY, z: centerZ },
                    size: { x: maxX - minX, y: maxY - minY, z: maxZ - minZ }
                };
            }
            
            getAllPathNames() {
                return Array.from(this.paths.keys());
            }
            
            getAllPathData() {
                return Array.from(this.pathData.values());
            }
            
            getPath(name) {
                return this.paths.get(name) || null;
            }
            
            getPathData(name) {
                return this.pathData.get(name) || null;
            }
        }
        
        // 测试路径解析
        async function testPathParsing() {
            log('🧪 开始测试路径解析...', 'info');
            
            pathManager = new PathManager();
            const foundCount = await pathManager.parseOBJFile('./models/line.obj');
            
            if (foundCount > 0) {
                updateStatus();
                log('✅ 路径解析测试成功', 'success');
            } else {
                log('❌ 路径解析测试失败', 'error');
            }
        }
        
        // 显示路径信息
        function showPathInfo() {
            if (!pathManager || !pathManager.isInitialized) {
                log('❌ 路径管理器未初始化', 'error');
                return;
            }
            
            const pathNames = pathManager.getAllPathNames();
            const pathData = pathManager.getAllPathData();
            
            log('📋 路径信息:', 'info');
            pathData.forEach((path, index) => {
                log(`  ${index + 1}. ${path.name}`, 'info');
                log(`     - 长度: ${path.length.toFixed(2)}`, 'info');
                log(`     - 点数: ${path.points.length}`, 'info');
                log(`     - 中心: (${path.boundingBox.center.x.toFixed(2)}, ${path.boundingBox.center.y.toFixed(2)}, ${path.boundingBox.center.z.toFixed(2)})`, 'info');
            });
        }
        
        // 创建路径可视化
        function createPathVisualization() {
            if (!pathManager || !pathManager.isInitialized) {
                log('❌ 路径管理器未初始化', 'error');
                return;
            }
            
            // 清除之前的路径线
            pathLines.forEach(line => scene.remove(line));
            pathLines = [];
            
            const pathData = pathManager.getAllPathData();
            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff];
            
            pathData.forEach((path, index) => {
                const curve = path.curve;
                const points = curve.getPoints(100);
                
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ 
                    color: colors[index % colors.length],
                    linewidth: 3
                });
                
                const line = new THREE.Line(geometry, material);
                scene.add(line);
                pathLines.push(line);
                
                log(`✅ 创建路径可视化: ${path.name}`, 'success');
            });
            
            log(`📊 共创建 ${pathLines.length} 条路径线`, 'info');
        }
        
        // 更新状态信息
        function updateStatus() {
            if (!pathManager || !pathManager.isInitialized) {
                document.getElementById('parseStatus').textContent = '未初始化';
                document.getElementById('pathCount').textContent = '0';
                document.getElementById('pathNames').textContent = '-';
                return;
            }
            
            const pathNames = pathManager.getAllPathNames();
            const pathData = pathManager.getAllPathData();
            
            document.getElementById('parseStatus').textContent = '已解析';
            document.getElementById('pathCount').textContent = pathNames.length;
            document.getElementById('pathNames').textContent = pathNames.join(', ');
        }
        
        // 记录日志
        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        // 渲染循环
        function animate() {
            requestAnimationFrame(animate);
            
            if (controls) {
                controls.update();
            }
            
            renderer.render(scene, camera);
        }
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 初始化
        document.addEventListener('DOMContentLoaded', async function() {
            initThreeJS();
            
            // 自动测试路径解析
            await testPathParsing();
            
            // 隐藏加载界面，显示控制面板
            document.getElementById('loading').style.display = 'none';
            document.getElementById('controls').style.display = 'block';
            document.getElementById('status').style.display = 'block';
            
            log('🎮 Line.obj路径解析测试页面已加载', 'success');
        });
    </script>
</body>
</html>
