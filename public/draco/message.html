<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe通讯演示页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 5px solid #4facfe;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(86, 171, 47, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(240, 147, 251, 0.3);
        }

        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.3);
        }


        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .status.connected {
            background: #2ecc71;
            color: white;
        }

        .status.disconnected {
            background: #e74c3c;
            color: white;
        }

        .iframe-container {
            margin-top: 20px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            overflow: hidden;
        }

        .iframe-container iframe {
            width: 100%;
            height: 600px;
            border: none;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .content {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 iframe通讯演示</h1>
            <p>与3D场景进行实时数据交互</p>
            <p style="font-size: 0.9em; opacity: 0.8; margin-top: 5px;">
                💡 提示：请先发送数据，然后在3D场景中鼠标移入模型查看标签效果
            </p>
            <span class="status disconnected" id="connectionStatus">未连接</span>
        </div>

        <div class="content">
            <!-- iframe配置区域 -->
            <div class="section">
                <h2>⚙️ iframe配置</h2>
                <div class="form-group">
                    <label for="iframeUrl">3D场景地址:</label>
                    <input type="url" id="iframeUrl" placeholder="https://example.com/3d-scene/" value="https://chenhaiqiang32.github.io/taobaorm_W2E---MLUX/">
                </div>
                <div class="button-group">
                    <button class="btn btn-info" onclick="updateIframeFromInput()">更新iframe地址</button>
                    <button class="btn btn-warning" onclick="resetIframeConfig()">重置为默认地址</button>
                </div>
            </div>

            <!-- 多设备数据发送区域 -->
            <div class="section">
                <h2>🚀 多设备数据发送</h2>
                <div class="form-group">
                    <label for="deviceData">设备数据 (JSON格式):</label>
                    <textarea id="deviceData" placeholder='[{"deviceid": 3423, "data": {"title": "设备标题", "configs": [{"label": "属性1", "value": "值1"}]}}]'>[
  {
    "deviceid": "Mesh_equipment_mtl",
    "data": {
      "title": "设备信息",
      "configs": [
        {"label": "设备类型", "value": "工业设备"},
        {"label": "状态", "value": "运行中"},
        {"label": "温度", "value": "65°C"},
        {"label": "压力", "value": "2.3 MPa"}
      ]
    }
  },
  {
    "deviceid": "Mesh_equipment_ktwj",
    "data": {
      "title": "结构信息",
      "configs": [
        {"label": "结构类型", "value": "钢结构"},
        {"label": "材料", "value": "Q235B"},
        {"label": "高度", "value": "12.5m"},
        {"label": "重量", "value": "8.2t"}
      ]
    }
  }
]</textarea>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="sendDeviceData()">发送设备数据</button>
                </div>
            </div>

            <!-- 机械臂控制区域 -->
            <div class="section">
                <h2>🤖 机械臂路径控制</h2>
                <div class="form-group">
                    <label for="robotArmModel">机械臂编号:</label>
                    <input type="text" id="robotArmModel" placeholder="例如: 03" value="03">
                </div>
                <div class="form-group">
                    <label for="robotArmPath">路径名称:</label>
                    <input type="text" id="robotArmPath" placeholder="例如: D_M" value="D_M">
                </div>
                <div class="form-group">
                    <label for="robotArmDuration">移动时间 (毫秒):</label>
                    <input type="number" id="robotArmDuration" placeholder="5000" value="5000" min="1000" max="30000">
                </div>
                <div class="form-group">
                    <label for="robotArmEasing">缓动函数:</label>
                    <select id="robotArmEasing">
                        <option value="linear">线性</option>
                        <option value="easeIn">缓入</option>
                        <option value="easeOut">缓出</option>
                        <option value="easeInOut" selected>缓入缓出</option>
                    </select>
                </div>
                <div class="button-group">
                    <button class="btn btn-success" onclick="sendRobotArmControl()">开始移动</button>
                    <button class="btn btn-warning" onclick="sendRobotArmStop()">停止移动</button>
                    <button class="btn btn-info" onclick="sendRobotArmReset()">重置位置</button>
                </div>
            </div>

            <!-- 环境切换区域 -->
            <div class="section">
                <h2>🌍 环境切换</h2>
                <div class="form-group">
                    <label for="environmentType">环境类型:</label>
                    <select id="environmentType" onchange="updatePresetOptions()">
                        <option value="hdr">HDR 环境贴图</option>
                        <option value="room">Room 环境</option>
                        <option value="background">普通背景图</option>
                        <option value="default">默认天空色</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="environmentPreset">环境预设:</label>
                    <select id="environmentPreset">
                        <!-- HDR选项 -->
                        <option value="royal_esplanade" data-type="hdr">Royal Esplanade - 皇家大道黄昏</option>
                        <option value="dutch_sky" data-type="hdr">Dutch Sky - 荷兰天空</option>
                        <option value="la_downtown" data-type="hdr">LA Downtown - 洛杉矶市中心</option>
                        <option value="venice_sunset" data-type="hdr">Venice Sunset - 威尼斯日落</option>
                        <option value="bg" data-type="hdr">Background - 背景天空</option>
                        <option value="sunny2" data-type="hdr">Sunny 2 - 晴朗天空 2</option>
                        <!-- Room选项 -->
                        <option value="room" data-type="room" style="display:none;">Room Environment</option>
                        <!-- 背景图选项 -->
                        <option value="sunny" data-type="background" style="display:none;">Sunny - 晴朗天空</option>
                        <option value="sunny2" data-type="background" style="display:none;">Sunny 2 - 晴朗天空 2</option>
                        <!-- 默认选项 -->
                        <option value="default" data-type="default" style="display:none;">Default Sky Color</option>
                    </select>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="sendEnvironmentSwitch()">切换环境</button>
                </div>
            </div>

            <!-- 3D场景iframe -->
            <div class="section">
                <h2>🎮 3D场景</h2>
                <div class="iframe-container">
                    <iframe id="sceneFrame" src="" title="3D场景"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 配置对象 - 集中管理iframe地址
        const CONFIG = {
            iframeUrl: 'https://chenhaiqiang32.github.io/taobaorm_W2E---MLUX/'
        };

        // 更新iframe配置的函数
        function updateIframeConfig(newUrl) {
            CONFIG.iframeUrl = newUrl;
            sceneFrame.src = CONFIG.iframeUrl;
            updateConnectionStatus(false);
            console.log('🔄 iframe地址已更新为:', newUrl);
        }

        // 从输入框更新iframe地址
        function updateIframeFromInput() {
            const newUrl = document.getElementById('iframeUrl').value.trim();
            if (!newUrl) {
                alert('请输入有效的URL地址');
                return;
            }
            
            // 简单的URL验证
            try {
                new URL(newUrl);
                updateIframeConfig(newUrl);
                showMessage('iframe地址已更新', 'success');
            } catch (error) {
                alert('请输入有效的URL地址');
            }
        }

        // 重置为默认地址
        function resetIframeConfig() {
            const defaultUrl = 'https://chenhaiqiang32.github.io/taobaorm_W2E---MLUX';
            document.getElementById('iframeUrl').value = defaultUrl;
            updateIframeConfig(defaultUrl);
            showMessage('已重置为默认地址', 'info');
        }

        // 页面元素
        const connectionStatus = document.getElementById('connectionStatus');
        const sceneFrame = document.getElementById('sceneFrame');

        // 设置iframe源地址
        sceneFrame.src = CONFIG.iframeUrl;

        // 监听iframe加载完成
        sceneFrame.addEventListener('load', function() {
            updateConnectionStatus(true);
        });

        // 监听来自iframe的消息
        window.addEventListener('message', function(event) {
            // 安全检查：只接受来自iframe源的消息
            if (event.origin !== CONFIG.iframeUrl) {
                return;
            }
        });

        // 初始化环境预设选项
        window.addEventListener('DOMContentLoaded', function() {
            updatePresetOptions();
        });

        // 发送多设备数据
        function sendDeviceData() {
            try {
                const deviceDataText = document.getElementById('deviceData').value;
                const deviceData = JSON.parse(deviceDataText);
                
                // 验证数据格式
                if (!Array.isArray(deviceData)) {
                    throw new Error('数据必须是数组格式');
                }
                
                // 验证每个设备数据
                deviceData.forEach((device, index) => {
                    if (!device.deviceid || !device.data) {
                        throw new Error(`第${index + 1}个设备数据格式错误，必须包含deviceid和data字段`);
                    }
                    if (!device.data.title || !Array.isArray(device.data.configs)) {
                        throw new Error(`第${index + 1}个设备数据格式错误，data必须包含title和configs字段`);
                    }
                });
                
                sendMessage('deviceData', deviceData);
            } catch (error) {
                alert('数据格式错误: ' + error.message);
            }
        }

        // 发送机械臂控制消息
        function sendRobotArmControl() {
            try {
                const model = document.getElementById('robotArmModel').value.trim();
                const line = document.getElementById('robotArmPath').value.trim();
                const duration = parseInt(document.getElementById('robotArmDuration').value);
                const easing = document.getElementById('robotArmEasing').value;
                
                // 验证输入
                if (!model) {
                    throw new Error('请输入机械臂编号');
                }
                if (!line) {
                    throw new Error('请输入路径名称');
                }
                if (isNaN(duration) || duration < 1000 || duration > 30000) {
                    throw new Error('移动时间必须在1000-30000毫秒之间');
                }
                
                // 构建控制数据
                const controlData = {
                    model: model,
                    line: line,
                    options: {
                        duration: duration,
                        easing: easing,
                        loop: false,
                        reverse: false
                    }
                };
                
                console.log('🤖 发送机械臂控制消息:', controlData);
                sendMessage('robotArmControl', controlData);
                
                // 显示成功消息
                showMessage(`机械臂 ${model} 开始沿路径 ${line} 移动`, 'success');
                
            } catch (error) {
                alert('机械臂控制数据错误: ' + error.message);
            }
        }

        // 停止机械臂移动
        function sendRobotArmStop() {
            try {
                const model = document.getElementById('robotArmModel').value.trim();
                
                if (!model) {
                    throw new Error('请输入机械臂编号');
                }
                
                // 构建停止控制数据
                const controlData = {
                    model: model,
                    action: 'stop'
                };
                
                console.log('⏹️ 发送机械臂停止消息:', controlData);
                sendMessage('robotArmStop', controlData);
                
                showMessage(`机械臂 ${model} 移动已停止`, 'info');
                
            } catch (error) {
                alert('停止机械臂失败: ' + error.message);
            }
        }

        // 重置机械臂位置
        function sendRobotArmReset() {
            try {
                const model = document.getElementById('robotArmModel').value.trim();
                
                if (!model) {
                    throw new Error('请输入机械臂编号');
                }
                
                // 构建重置控制数据
                const controlData = {
                    model: model,
                    action: 'reset'
                };
                
                console.log('🔄 发送机械臂重置消息:', controlData);
                sendMessage('robotArmReset', controlData);
                
                showMessage(`机械臂 ${model} 已重置到原始位置`, 'info');
                
            } catch (error) {
                alert('重置机械臂失败: ' + error.message);
            }
        }

        // 更新预设选项显示
        function updatePresetOptions() {
            const typeSelect = document.getElementById('environmentType');
            const presetSelect = document.getElementById('environmentPreset');
            const selectedType = typeSelect.value;
            
            // 隐藏所有选项
            Array.from(presetSelect.options).forEach(option => {
                option.style.display = 'none';
            });
            
            // 显示匹配类型的选项
            Array.from(presetSelect.options).forEach(option => {
                if (option.dataset.type === selectedType) {
                    option.style.display = '';
                }
            });
            
            // 自动选择第一个可见选项
            const visibleOptions = Array.from(presetSelect.options).filter(opt => opt.style.display !== 'none');
            if (visibleOptions.length > 0) {
                presetSelect.value = visibleOptions[0].value;
            }
        }

        // 发送环境切换消息
        function sendEnvironmentSwitch() {
            try {
                const presetId = document.getElementById('environmentPreset').value;
                const presetType = document.getElementById('environmentType').value;
                
                if (!presetId) {
                    throw new Error('请选择环境预设');
                }
                
                // 构建环境切换数据
                const environmentData = {
                    presetId: presetId,
                    presetType: presetType
                };
                
                console.log('🌍 发送环境切换消息:', environmentData);
                sendMessage('switchEnvironment', environmentData);
                
                showMessage(`正在切换环境...`, 'info');
                
            } catch (error) {
                alert('环境切换失败: ' + error.message);
            }
        }
        
        // 发送消息到iframe
        function sendMessage(type, data) {
            if (!sceneFrame.contentWindow) {
                alert('iframe未加载完成');
                return;
            }

            const message = {
                type,
                data
            };

            try {
                sceneFrame.contentWindow.postMessage(message, CONFIG.iframeUrl);
            } catch (error) {
                alert('发送消息失败: ' + error.message);
            }
        }

        // 更新连接状态
        function updateConnectionStatus(connected) {
            if (connected) {
                connectionStatus.textContent = '已连接';
                connectionStatus.className = 'status connected';
            } else {
                connectionStatus.textContent = '未连接';
                connectionStatus.className = 'status disconnected';
            }
        }

        // 显示消息提示
        function showMessage(message, type = 'info') {
            // 创建消息元素
            const messageEl = document.createElement('div');
            messageEl.className = `status ${type}`;
            messageEl.textContent = message;
            messageEl.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 1000;
                padding: 10px 15px;
                border-radius: 5px;
                font-size: 14px;
                max-width: 300px;
                word-wrap: break-word;
                animation: slideIn 0.3s ease-out;
            `;
            
            // 添加动画样式
            if (!document.getElementById('messageAnimation')) {
                const style = document.createElement('style');
                style.id = 'messageAnimation';
                style.textContent = `
                    @keyframes slideIn {
                        from { transform: translateX(100%); opacity: 0; }
                        to { transform: translateX(0); opacity: 1; }
                    }
                `;
                document.head.appendChild(style);
            }
            
            document.body.appendChild(messageEl);
            
            // 3秒后自动移除
            setTimeout(() => {
                if (messageEl.parentNode) {
                    messageEl.parentNode.removeChild(messageEl);
                }
            }, 3000);
        }
    </script>
</body>
</html>
